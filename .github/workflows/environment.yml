name: Lab environment

on:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - .python-version
      - scripts/**
      - .github/workflows/environment.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .python-version
      - scripts/**
      - .github/workflows/environment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Run Windows setup and environment check
        if: runner.os == 'Windows'
        run: ./scripts/setup.ps1
      - run: uv sync --locked
        if: runner.os != 'Windows'
      - run: uv pip check
      - run: uv run --locked python scripts/check_environment.py
        if: runner.os != 'Windows'
