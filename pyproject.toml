[project]
name = "deep-learning-specialization-labs"
version = "0.1.0"
description = "Reproducible environment for the Coursera Deep Learning Specialization labs"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Keep the APIs used by the original assignments (including np.int/np.bool).
    "numpy==1.23.5",
    "scipy==1.10.1",
    "pandas==1.5.3",
    "matplotlib==3.7.5",
    "scikit-learn==1.2.2",
    "h5py==3.8.0",
    "pillow==9.5.0",
    "imageio==2.31.6",
    "tensorflow==2.10.1",
    "keras==2.10.0",
    "protobuf==3.19.6",
    "setuptools==75.8.2",
    "wrapt==1.14.1",
    "dlai-tools==0.5.7",
    "termcolor==2.4.0",
    "ipython==8.37.0",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.7",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    # Sequence models, music, dates and emoji aliases.
    "music21==6.7.1",
    "mido==1.3.3",
    "pydub==0.25.1",
    "faker==8.13.2",
    "babel==2.12.1",
    "emoji==1.7.0",
    "tqdm==4.67.1",
    # Transformer bonus notebooks are included in the default environment.
    "transformers==4.30.2",
    "datasets==2.14.7",
    "pyarrow==14.0.2",
    "seqeval==1.2.2",
    "accelerate==0.20.3",
    "torch==2.2.2+cpu",
]

[tool.uv]
package = false
required-version = ">=0.12.19"
build-constraint-dependencies = ["setuptools==75.8.2"]
environments = [
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
